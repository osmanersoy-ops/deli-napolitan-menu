<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>deli. napolitan | QR Menü</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --brand-green: #31543e;
      --brand-green-dark: #203628;
      --brand-green-light: #446f53;
      --brand-cream: #f5f5dc;
      --brand-cream-light: #faf9f2;
      --bg-page: #f6f5ef;
      --card-bg: #ffffff;
      --text-main: #1d2b21;
      --text-muted: #647167;
      --text-light: #8e9a91;
      --border-color: #e5e5da;
      --border-subtle: #eeeee5;
      --spicy-red: #d93829;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 2px 8px rgba(34, 58, 43, 0.05);
      --shadow-md: 0 6px 20px rgba(34, 58, 43, 0.08);
      --shadow-lg: 0 14px 36px rgba(34, 58, 43, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 90px; /* Space for the floating tray bar */
    }

    /* ---------------------------------------------------- */
    /* 1. SPLASH / LANGUAGE SELECTOR OVERLAY                 */
    /* ---------------------------------------------------- */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(165deg, var(--brand-green-dark) 0%, var(--brand-green) 100%);
      color: var(--brand-cream);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 24px;
      text-align: center;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-logo {
      width: 140px;
      height: 140px;
      border-radius: 28px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.25);
      border: 3px solid rgba(245, 245, 220, 0.2);
      margin-bottom: 24px;
      object-fit: cover;
      background-color: var(--brand-green);
    }

    .splash-title {
      font-family: 'Playfair Display', serif;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.1;
      margin-bottom: 8px;
      color: var(--brand-cream);
    }

    .splash-tagline {
      font-size: 14px;
      color: rgba(245, 245, 220, 0.85);
      font-weight: 400;
      max-width: 280px;
      margin-bottom: 36px;
      line-height: 1.4;
    }

    .splash-lang-box {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .splash-lang-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(245, 245, 220, 0.3);
      border-radius: var(--radius-md);
      color: var(--brand-cream);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    .splash-lang-btn:active {
      transform: scale(0.98);
      background: rgba(255, 255, 255, 0.16);
      border-color: var(--brand-cream);
    }

    .splash-lang-btn .flag {
      font-size: 22px;
      margin-right: 12px;
    }

    .splash-lang-btn .arrow {
      font-size: 18px;
      opacity: 0.7;
    }

    /* ---------------------------------------------------- */
    /* 2. TOP BRAND HEADER (Clean, Logo + Language Only)    */
    /* ---------------------------------------------------- */
    .brand-header {
      background: linear-gradient(180deg, var(--brand-green) 0%, var(--brand-green-dark) 100%);
      color: var(--brand-cream);
      padding: 12px 18px;
      position: relative;
    }

    .header-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-logo-row {
      display: flex;
      align-items: center;
    }

    .header-logo-img {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      object-fit: cover;
      border: 1.5px solid rgba(245, 245, 220, 0.3);
      background: var(--brand-green);
      display: block;
    }

    .lang-switcher-pill {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(245, 245, 220, 0.3);
      border-radius: 20px;
      padding: 4px 6px;
      gap: 4px;
      cursor: pointer;
    }

    .lang-opt {
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 14px;
      color: rgba(245, 245, 220, 0.7);
      transition: all 0.2s ease;
    }

    .lang-opt.active {
      background: var(--brand-cream);
      color: var(--brand-green-dark);
    }

    /* ---------------------------------------------------- */
    /* 3. STICKY CATEGORY NAV (5 Square Cards, Fits Screen) */
    /* ---------------------------------------------------- */
    .category-nav-wrapper {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
      padding: 8px 12px 10px;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(var(--cat-cols, 5), 1fr);
      gap: 6px;
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    .category-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--text-muted);
      cursor: pointer;
      min-width: 0;
      transition: transform 0.15s ease;
    }

    .category-card:active {
      transform: scale(0.95);
    }

    .cat-img-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      height: auto;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      background-color: #e5e5dc;
      border: 2px solid transparent;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }

    .cat-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .cat-name-label {
      font-size: 11px;
      font-weight: 700;
      margin-top: 4px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      color: var(--text-muted);
      transition: color 0.2s ease;
    }

    /* Active Category state */
    .category-card.active .cat-img-box {
      border-color: var(--brand-green);
      box-shadow: 0 0 0 1px var(--brand-green), 0 3px 8px rgba(49, 84, 62, 0.3);
    }

    .category-card.active .cat-img-box img {
      transform: scale(1.06);
    }

    .category-card.active .cat-name-label {
      color: var(--brand-green);
      font-weight: 800;
    }

    /* ---------------------------------------------------- */
    /* 4. MAIN CONTENT FEED & PRODUCTS                      */
    /* ---------------------------------------------------- */
    .menu-container {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px 14px 40px;
    }

    .category-section {
      margin-bottom: 26px;
      scroll-margin-top: 100px;
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 2px solid var(--brand-green);
      padding-bottom: 6px;
      margin-bottom: 12px;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--brand-green-dark);
      letter-spacing: -0.3px;
      text-transform: lowercase;
    }

    .section-count {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-light);
    }

    .product-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Product Card */
    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow-sm);
      position: relative;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .card-top-content {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
    }

    .card-info {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 4px;
    }

    .product-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.25;
      letter-spacing: -0.2px;
    }

    .spicy-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 12px;
      line-height: 1.2;
      vertical-align: middle;
      background-color: rgba(217, 56, 41, 0.08);
      color: var(--spicy-red);
      border: 1px solid rgba(217, 56, 41, 0.22);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .spicy-badge .spicy-text {
      font-size: 11px;
      font-weight: 700;
      color: var(--spicy-red);
      letter-spacing: -0.1px;
    }

    .custom-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      padding: 2px 7px;
      border-radius: 4px;
      background-color: rgba(49, 84, 62, 0.08);
      color: var(--brand-green);
      border: 1px solid rgba(49, 84, 62, 0.2);
    }

    .product-description {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.45;
      margin-top: 3px;
      margin-bottom: 8px;
    }

    .product-price {
      font-size: 16px;
      font-weight: 800;
      color: var(--brand-green);
      margin-top: auto;
    }

    /* Right image thumbnail */
    .card-image-box {
      flex: 0 0 96px;
      width: 96px;
      height: 96px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background-color: #ebebe0;
      position: relative;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }

    .card-image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Card CTA footer */
    .card-cta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px dashed var(--border-subtle);
      padding-top: 8px;
      gap: 8px;
    }

    .cta-text-icon {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--brand-green);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
    }

    .cta-icon-camera {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .cta-arrow {
      font-size: 13px;
      opacity: 0.8;
      margin-left: 2px;
    }

    /* Tepsime Ekle Button */
    .btn-add-tray {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(49, 84, 62, 0.08);
      color: var(--brand-green);
      border: 1.5px solid rgba(49, 84, 62, 0.25);
      border-radius: 20px;
      padding: 6px 13px;
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: transform 0.12s ease, background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }

    /* Mobile press effect */
    .btn-add-tray:active, .btn-add-tray.btn-pressed {
      transform: scale(0.86);
      background: var(--brand-green-dark) !important;
      color: var(--brand-cream) !important;
      border-color: var(--brand-green-dark) !important;
    }

    /* Koyu (Dark) state when item is in the tray */
    .btn-add-tray.in-tray {
      background: var(--brand-green);
      color: var(--brand-cream);
      border-color: var(--brand-green);
      box-shadow: 0 3px 10px rgba(49, 84, 62, 0.35);
    }

    .btn-add-tray.in-tray:active, .btn-add-tray.in-tray.btn-pressed {
      background: var(--brand-green-dark) !important;
      transform: scale(0.86);
    }

    .btn-add-tray .plus-symbol {
      font-size: 14px;
      font-weight: 800;
      transition: transform 0.2s ease;
    }

    .btn-add-tray:active .plus-symbol {
      transform: rotate(90deg);
    }

    /* ---------------------------------------------------- */
    /* 5. SLENDER FLOATING TRAY BAR                         */
    /* ---------------------------------------------------- */
    .tray-floating-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 480px;
      height: 48px;
      background: var(--brand-green-dark);
      color: var(--brand-cream);
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      box-shadow: 0 8px 24px rgba(27, 48, 35, 0.4), 0 2px 6px rgba(0,0,0,0.15);
      z-index: 900;
      cursor: pointer;
      border: 1px solid rgba(245, 245, 220, 0.2);
      backdrop-filter: blur(10px);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: transform 0.12s ease, box-shadow 0.15s ease;
    }

    .tray-floating-bar:active, .tray-floating-bar.bar-pressed {
      transform: translateX(-50%) scale(0.95);
      box-shadow: 0 4px 12px rgba(27, 48, 35, 0.5);
    }

    .tray-bar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tray-icon-box {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tray-svg-icon {
      width: 22px;
      height: 22px;
      fill: var(--brand-cream);
    }

    .tray-badge {
      position: absolute;
      top: -6px;
      right: -8px;
      background: var(--spicy-red);
      color: #ffffff;
      font-size: 10px;
      font-weight: 800;
      min-width: 17px;
      height: 17px;
      line-height: 17px;
      border-radius: 10px;
      text-align: center;
      padding: 0 4px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .tray-badge.pulse {
      transform: scale(1.35);
    }

    .tray-bar-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: var(--brand-cream);
    }

    .tray-bar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tray-bar-total {
      font-size: 14px;
      font-weight: 800;
      color: var(--brand-cream);
    }

    .tray-bar-arrow {
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.8px;
      background: rgba(245, 245, 220, 0.16);
      border: 1px solid rgba(245, 245, 220, 0.25);
      padding: 6px 14px;
      border-radius: 14px;
      color: var(--brand-cream);
      text-transform: uppercase;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .tray-bar-arrow:active, .tray-bar-arrow.btn-pressed, .tray-floating-bar:active .tray-bar-arrow {
      transform: scale(0.88);
      background: rgba(245, 245, 220, 0.38) !important;
      border-color: var(--brand-cream) !important;
    }

    /* ---------------------------------------------------- */
    /* 6. MODAL (PRODUCT DETAILS)                           */
    /* ---------------------------------------------------- */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(18, 30, 22, 0.65);
      backdrop-filter: blur(6px);
      z-index: 1000;
      display: flex;
      align-items: center; /* Desktop centered */
      justify-content: center;
      padding: 24px 20px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .modal-sheet {
      background: var(--card-bg);
      width: 100%;
      max-width: 520px;
      border-radius: 24px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: scale(0.92);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.28);
    }

    .modal-backdrop.open .modal-sheet {
      transform: scale(1);
    }

    /* Mobile: Native Bottom Sheet style */
    @media (max-width: 640px) {
      .modal-backdrop {
        align-items: flex-end;
        padding: 0;
      }

      .modal-sheet {
        max-width: 100%;
        border-radius: 24px 24px 0 0;
        max-height: 86vh;
        transform: translateY(100%);
        padding-bottom: env(safe-area-inset-bottom, 16px);
      }

      .modal-backdrop.open .modal-sheet {
        transform: translateY(0);
      }
    }

    .modal-header-img {
      width: 100%;
      height: 240px;
      position: relative;
      background: #333;
      overflow: hidden;
      flex-shrink: 0;
    }

    .modal-header-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Close button on the LEFT as requested */
    .modal-close-btn {
      position: absolute;
      top: 14px;
      left: 14px; /* On the LEFT! */
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background 0.2s ease;
      z-index: 10;
    }

    .modal-close-btn:active {
      background: rgba(0, 0, 0, 0.85);
    }

    .modal-body {
      padding: 20px 20px 24px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .modal-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .modal-product-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
    }

    .modal-product-price {
      font-size: 20px;
      font-weight: 800;
      color: var(--brand-green);
      white-space: nowrap;
    }

    .modal-badges-container {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 14px;
    }

    .modal-description {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 18px;
      background: var(--bg-page);
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--brand-green);
    }

    .modal-section-subtitle {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--brand-green);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .allergen-chips-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .allergen-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(49, 84, 62, 0.08);
      border: 1px solid rgba(49, 84, 62, 0.2);
      font-size: 13px;
      font-weight: 600;
      color: var(--brand-green-dark);
    }

    .allergen-chip.empty {
      background: #f1f2ec;
      border-color: #dcded2;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Modal Add to Tray button */
    .modal-add-tray-btn {
      width: 100%;
      background: rgba(49, 84, 62, 0.08);
      color: var(--brand-green);
      border: 1.5px solid rgba(49, 84, 62, 0.3);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: transform 0.12s ease, background 0.15s ease, color 0.15s ease;
    }

    .modal-add-tray-btn:active, .modal-add-tray-btn.btn-pressed {
      transform: scale(0.94);
      background: var(--brand-green-dark) !important;
      color: var(--brand-cream) !important;
    }

    /* Koyu (Dark) state inside modal */
    .modal-add-tray-btn.in-tray {
      background: var(--brand-green);
      color: var(--brand-cream);
      border-color: var(--brand-green);
      box-shadow: 0 4px 14px rgba(49, 84, 62, 0.35);
    }

    /* ---------------------------------------------------- */
    /* 7. TRAY MODAL (Garsona Göstermelik Liste)            */
    /* ---------------------------------------------------- */
    .tray-modal-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tray-modal-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--brand-green-dark);
    }

    .tray-modal-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .tray-modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      max-height: 52vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tray-empty-message {
      text-align: center;
      padding: 36px 16px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .tray-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--bg-page);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      gap: 10px;
    }

    .tray-item-details {
      flex: 1;
    }

    .tray-item-name {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.25;
    }

    .tray-item-price {
      font-size: 13px;
      color: var(--brand-green);
      font-weight: 600;
      margin-top: 2px;
    }

    .tray-qty-ctrl {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 3px 8px;
    }

    .tray-qty-btn {
      background: none;
      border: none;
      font-size: 16px;
      font-weight: 800;
      color: var(--brand-green);
      cursor: pointer;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tray-qty-val {
      font-size: 14px;
      font-weight: 800;
      min-width: 16px;
      text-align: center;
    }

    .tray-modal-footer {
      padding: 16px 20px 20px;
      border-top: 1px solid var(--border-color);
      background: #ffffff;
    }

    .tray-total-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .tray-total-label {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .tray-total-val {
      font-size: 22px;
      font-weight: 800;
      color: var(--brand-green);
    }

    .tray-actions-row {
      display: flex;
      gap: 10px;
    }

    .tray-btn-clear {
      flex: 1;
      padding: 12px;
      background: #f1f2ec;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    .tray-btn-done {
      flex: 2;
      padding: 12px;
      background: var(--brand-green);
      border: none;
      border-radius: var(--radius-sm);
      color: var(--brand-cream);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    /* ---------------------------------------------------- */
    /* 8. FOOTER                                            */
    /* ---------------------------------------------------- */
    .menu-footer {
      text-align: center;
      padding: 30px 20px 20px;
      color: var(--text-muted);
      font-size: 13px;
      border-top: 1px solid var(--border-color);
      margin-top: 20px;
    }

    .footer-note {
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .footer-date {
      font-size: 12px;
      color: var(--text-light);
      margin-bottom: 16px;
    }

    .footer-brand {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--brand-green);
    }
  </style>
</head>
<body>

  <!-- 1. SPLASH / LANGUAGE SELECTOR OVERLAY -->
  <div id="splash-screen">
    <img src="assets/logo.png" alt="deli. napolitan logo" class="splash-logo">
    <h1 class="splash-title">deli. napolitan</h1>
    <p class="splash-tagline">neo-neapolitan recipes with local delicatessen</p>
    
    <div class="splash-lang-box">
      <button class="splash-lang-btn" onclick="selectLanguage('tr')">
        <span style="display:flex; align-items:center;">
          <span class="flag">🇹🇷</span>
          <span>Türkçe Menü</span>
        </span>
        <span class="arrow">›</span>
      </button>
      
      <button class="splash-lang-btn" onclick="selectLanguage('en')">
        <span style="display:flex; align-items:center;">
          <span class="flag">🇬🇧</span>
          <span>English Menu</span>
        </span>
        <span class="arrow">›</span>
      </button>
    </div>
  </div>

  <!-- 2. BRAND HEADER (Clean Logo + Language Toggle Only) -->
  <header class="brand-header">
    <div class="header-top-bar">
      <div class="header-logo-row">
        <img src="assets/logo.png" alt="deli. napolitan" class="header-logo-img">
      </div>
      
      <!-- Quick Language Switcher -->
      <div class="lang-switcher-pill" title="Dil Değiştir / Switch Language">
        <span class="lang-opt active" id="pill-tr" onclick="setLanguage('tr')">TR</span>
        <span class="lang-opt" id="pill-en" onclick="setLanguage('en')">EN</span>
      </div>
    </div>
  </header>

  <!-- 3. STICKY CATEGORY NAV (5 Square Cards, Fits on Screen) -->
  <nav class="category-nav-wrapper">
    <div class="category-grid" id="category-grid">
      <!-- Injected by JavaScript -->
    </div>
  </nav>

  <!-- 4. MAIN MENU FEED -->
  <main class="menu-container">
    <div id="menu-sections">
      <!-- Injected by JavaScript -->
    </div>

    <!-- 5. FOOTER -->
    <footer class="menu-footer">
      <p class="footer-note" id="footer-note">Fiyatlarımız TL ve KDV dahildir.</p>
      <p class="footer-date" id="footer-date">Fiyat değişim tarihi: 14.06.2026</p>
      <p class="footer-brand">deli. napolitan</p>
    </footer>
  </main>

  <!-- 6. SLENDER FLOATING TRAY BAR -->
  <div class="tray-floating-bar" id="tray-floating-bar" onclick="openTrayModal()">
    <div class="tray-bar-left">
      <span class="tray-bar-arrow" id="tray-view-text">GÖSTER</span>
    </div>
    <div class="tray-bar-right">
      <span class="tray-bar-title" id="tray-label-text">Tepsi</span>
      <div class="tray-icon-box">
        <svg class="tray-svg-icon" viewBox="0 0 24 24">
          <path d="M12 2a1 1 0 0 1 1 1v1.07A8.001 8.001 0 0 1 20 12v1H4v-1a8.001 8.001 0 0 1 7-7.93V3a1 1 0 0 1 1-1zm8 13H4a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-1a1 1 0 0 0-1-1z"/>
        </svg>
        <span class="tray-badge" id="tray-badge-count">0</span>
      </div>
    </div>
  </div>

  <!-- 7. MODAL (PRODUCT DETAILS & ALLERGENS) -->
  <div class="modal-backdrop" id="product-modal" onclick="closeModalOnBackdrop(event)">
    <div class="modal-sheet">
      <div class="modal-header-img">
        <img id="modal-img" src="" alt="Ürün Fotoğrafı">
        <!-- Close button on LEFT -->
        <button class="modal-close-btn" onclick="closeModal()">✕</button>
      </div>
      
      <div class="modal-body">
        <div class="modal-title-row">
          <h2 class="modal-product-title" id="modal-title">Ürün Başlığı</h2>
          <span class="modal-product-price" id="modal-price">0 ₺</span>
        </div>

        <div class="modal-badges-container" id="modal-badges"></div>

        <p class="modal-description" id="modal-desc"></p>

        <h3 class="modal-section-subtitle" id="modal-allergen-heading">
          <svg style="width:16px;height:16px;fill:currentColor;" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
          </svg>
          <span>Alerjen Bilgileri</span>
        </h3>

        <div class="allergen-chips-list" id="modal-allergens"></div>

        <!-- Add to Tray Button inside Modal -->
        <button class="modal-add-tray-btn" id="modal-add-tray-btn" onclick="handleAddModalItemToTray()">
          <span>🍽️</span>
          <span id="modal-add-tray-text">Tepsime Ekle</span>
          <span>+</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 8. TRAY MODAL (Garsona Göstermelik Sipariş Notu) -->
  <div class="modal-backdrop" id="tray-modal" onclick="closeTrayModalOnBackdrop(event)">
    <div class="modal-sheet">
      <div class="tray-modal-header">
        <div>
          <h2 class="tray-modal-title">🍽️ <span id="tray-title-text">Tepsimiz</span></h2>
          <p class="tray-modal-subtitle" id="tray-subtitle-text">Garsona sipariş verirken bu ekranı gösterebilirsiniz</p>
        </div>
        <button class="modal-close-btn" style="position:static; width:34px; height:34px; font-size:16px; background:#f0f1ea; color:#333; border:none;" onclick="closeTrayModal()">✕</button>
      </div>

      <div class="tray-modal-body" id="tray-items-container">
        <!-- Rendered by JS -->
      </div>

      <div class="tray-modal-footer">
        <div class="tray-actions-row">
          <button class="tray-btn-clear" onclick="clearTray()" id="tray-clear-btn-text">Tepsiyi Boşalt</button>
          <button class="tray-btn-done" onclick="closeTrayModal()" id="tray-done-btn-text">Menüye Dön</button>
        </div>
      </div>
    </div>
  </div>

  <!-- SCRIPT -->
  <script src="data/menu_data.js"></script>
  <script>
    // State
    let currentLang = 'tr';
    let menuData = null;
    let activeCategoryId = null;
    let activeModalItem = null;
    
    // Tray state: [ { id, name, price, qty } ]
    let tray = [];

    // Translation UI Dictionaries
    const uiTexts = {
      tr: {
        tapForDetails: "Görseller ve alerjenler",
        addToTray: "Tepsime Ekle",
        inTray: "Tepside",
        trayTitle: "Tepsimiz",
        traySubtitle: "Garsona sipariş verirken bu ekranı gösterebilirsiniz",
        emptyTray: "Tepsiniz henüz boş. Menüden dilediğiniz lezzetleri ekleyebilirsiniz.",
        clearTray: "Tepsiyi Boşalt",
        backToMenu: "Menüye Dön",
        allergenTitle: "Alerjen Bilgileri",
        noAllergens: "Belirtilen belirgin bir alerjen bulunmamaktadır.",
        datePrefix: "Fiyat değişim tarihi: ",
        trayBarLabel: "Tepsi",
        view: "GÖSTER",
        spicyLevels: {
          1: "az acı",
          2: "orta acı",
          3: "çok acı"
        }
      },
      en: {
        tapForDetails: "Photos & allergens",
        addToTray: "Add to Tray",
        inTray: "In Tray",
        trayTitle: "Our Tray",
        traySubtitle: "Show this screen to your waiter to place your order",
        emptyTray: "Your tray is currently empty. Add your favorite items from the menu.",
        clearTray: "Clear Tray",
        backToMenu: "Back to Menu",
        allergenTitle: "Allergen Information",
        noAllergens: "No major allergens specified for this item.",
        datePrefix: "Price update date: ",
        trayBarLabel: "Tray",
        view: "VIEW",
        spicyLevels: {
          1: "mild",
          2: "medium spicy",
          3: "very spicy"
        }
      }
    };

    function getSpicyLabel(level, lang = currentLang) {
      const dict = uiTexts[lang]?.spicyLevels || uiTexts.tr.spicyLevels;
      if (level === 1) return dict[1];
      if (level === 2) return dict[2];
      if (level >= 3) return dict[3];
      return '';
    }

    // Allergen Icons
    const allergenIcons = {
      milk: "🥛",
      gluten: "🌾",
      nuts: "🥜",
      mustard: "🟡",
      sesame: "🌱",
      egg: "🥚",
      default: "⚠️"
    };

    // 1. Language Initialization & Live Tracking
    function trackLanguageChoice(lang) {
      try {
        const isAdminDevice = localStorage.getItem('deli_is_admin_device') === 'true' ||
                              localStorage.getItem('deli_admin_logged_in') === 'true' ||
                              localStorage.getItem('deli_github_token') ||
                              sessionStorage.getItem('deli_admin_logged_in') === 'true' ||
                              (document.referrer && document.referrer.includes('admin')) ||
                              window.location.search.includes('admin') ||
                              window.location.pathname.includes('admin');
        if (isAdminDevice) return;
        if (navigator.webdriver) return;

        const isLocal = window.location.hostname === 'localhost' || 
                        window.location.hostname === '127.0.0.1' || 
                        window.location.hostname.endsWith('.local');
        if (isLocal) return;

        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        const todayStr = `${now.getFullYear()}_${pad(now.getMonth() + 1)}_${pad(now.getDate())}`;

        const trackingKey = `deli_lang_logged_${todayStr}`;
        const lastLoggedLang = localStorage.getItem(trackingKey);

        // Müşteri dili seçtiğinde günün dil sayacına kaydet (günde 1 kez veya dil değiştirdiğinde)
        if (lastLoggedLang !== lang) {
          localStorage.setItem(trackingKey, lang);

          const hitKey = (key) => {
            try {
              fetch(`https://countapi.mileshilliard.com/api/v1/hit/${key}`, { mode: 'cors', priority: 'low' })
                .catch(() => {
                  fetch(`https://abacus.jasoncameron.dev/hit/delinapolitan/${key}`, { mode: 'cors', priority: 'low' }).catch(() => {});
                });
            } catch(e) {}
          };

          // Hem bugünün tarihli dil sayacına hem de genel sayaca kaydet
          hitKey(`deli_lang_${lang}_${todayStr}`);
          hitKey(`deli_lang_${lang}`);
        }
      } catch (err) {}
    }

    function initLanguage() {
      const savedLang = localStorage.getItem('deli_napolitan_lang');
      const urlParams = new URLSearchParams(window.location.search);
      const urlLang = urlParams.get('lang');
      const forceSplash = urlParams.get('splash') === '1';

      if (urlLang === 'tr' || urlLang === 'en') {
        selectLanguage(urlLang);
      } else if (savedLang && !forceSplash) {
        selectLanguage(savedLang);
      } else {
        document.getElementById('splash-screen').classList.remove('hidden');
      }
    }

    function selectLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('deli_napolitan_lang', lang);
      document.getElementById('splash-screen').classList.add('hidden');
      updateUI();
      trackLanguageChoice(lang);
    }

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('deli_napolitan_lang', lang);
      updateUI();
      trackLanguageChoice(lang);
    }

    function updateLanguageToggle() {
      document.getElementById('pill-tr').classList.toggle('active', currentLang === 'tr');
      document.getElementById('pill-en').classList.toggle('active', currentLang === 'en');
    }

    // 2. Fetch or load embedded menu data
    async function loadMenuData() {
      if (window.DELI_MENU_DATA) {
        menuData = window.DELI_MENU_DATA;
      }
      try {
        const response = await fetch('data/menu_data.json');
        if (response.ok) {
          menuData = await response.json();
        }
      } catch (e) {
        console.warn('Using preloaded menu_data.js data');
      }
      renderApp();
    }

    // 3. Render Application
    function renderApp() {
      if (!menuData) return;
      renderCategories();
      renderProducts();
      updateTrayUI();
      updateUI();
      setupScrollSpy();
    }

    function updateUI() {
      updateLanguageToggle();
      const t = uiTexts[currentLang];
      
      if (menuData) {
        document.getElementById('footer-note').textContent = menuData.restaurant.note[currentLang] || menuData.restaurant.note.tr;
        document.getElementById('footer-date').textContent = t.datePrefix + menuData.restaurant.date;
        
        renderCategories();
        renderProducts();
      }

      // Tray UI labels
      document.getElementById('tray-label-text').textContent = t.trayBarLabel;
      document.getElementById('tray-view-text').textContent = t.view;
      document.getElementById('tray-title-text').textContent = t.trayTitle;
      document.getElementById('tray-subtitle-text').textContent = t.traySubtitle;
      document.getElementById('tray-clear-btn-text').textContent = t.clearTray;
      document.getElementById('tray-done-btn-text').textContent = t.backToMenu;
      document.getElementById('modal-add-tray-text').textContent = t.addToTray;

      updateTrayUI();
    }

    // 4. Render Categories (Square Cards, 100% Fit)
    function renderCategories() {
      const grid = document.getElementById('category-grid');
      grid.innerHTML = '';

      const catCount = (menuData.categories && menuData.categories.length) || 5;
      if (catCount <= 6) {
        grid.style.setProperty('--cat-cols', catCount);
      } else {
        grid.style.setProperty('--cat-cols', Math.ceil(catCount / 2));
      }

      menuData.categories.forEach((cat, index) => {
        const isCurrentActive = activeCategoryId === cat.id || (!activeCategoryId && index === 0);
        const card = document.createElement('a');
        card.className = `category-card ${isCurrentActive ? 'active' : ''}`;
        card.id = `nav-cat-${cat.id}`;
        card.href = `#sec-${cat.id}`;
        card.onclick = (e) => {
          e.preventDefault();
          scrollToCategory(cat.id);
        };

        const catName = cat.name[currentLang] || cat.name.tr;

        card.innerHTML = `
          <div class="cat-img-box">
            <img src="${cat.image}" alt="${catName}" loading="lazy">
          </div>
          <span class="cat-name-label">${catName}</span>
        `;

        grid.appendChild(card);
      });
    }

    function scrollToCategory(catId) {
      activeCategoryId = catId;
      updateActiveCategoryNav(catId);
      
      const targetSec = document.getElementById(`sec-${catId}`);
      if (targetSec) {
        targetSec.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function updateActiveCategoryNav(catId) {
      document.querySelectorAll('.category-card').forEach(c => c.classList.remove('active'));
      const activeCard = document.getElementById(`nav-cat-${catId}`);
      if (activeCard) {
        activeCard.classList.add('active');
      }
    }

    // 5. Render Products
    function renderProducts() {
      const container = document.getElementById('menu-sections');
      container.innerHTML = '';
      const t = uiTexts[currentLang];

      menuData.categories.forEach(cat => {
        const catItems = menuData.items.filter(item => item.categoryId === cat.id);
        if (catItems.length === 0) return;

        const sec = document.createElement('section');
        sec.className = 'category-section';
        sec.id = `sec-${cat.id}`;

        const catName = cat.name[currentLang] || cat.name.tr;

        sec.innerHTML = `
          <div class="section-header">
            <h2 class="section-title">${catName}</h2>
            <span class="section-count">${catItems.length}</span>
          </div>
          <div class="product-list" id="list-${cat.id}"></div>
        `;

        const listContainer = sec.querySelector(`#list-${cat.id}`);

        catItems.forEach(item => {
          const itemCard = createProductCard(item, t);
          listContainer.appendChild(itemCard);
        });

        container.appendChild(sec);
      });
    }

    function createProductCard(item, t) {
      const card = document.createElement('div');
      card.className = 'product-card';

      const name = item.name[currentLang] || item.name.tr;
      const desc = item.description[currentLang] || item.description.tr;
      const priceFormatted = `${item.price} ₺`;

      // Check if already in tray
      const existingInTray = tray.find(x => x.id === item.id);
      const isAdded = existingInTray && existingInTray.qty > 0;
      const inTrayClass = isAdded ? 'in-tray' : '';
      const btnText = isAdded ? `${t.inTray} (${existingInTray.qty})` : t.addToTray;

      // Spicy Icon (🌶️ or 🌶️🌶️)
      let spicyHtml = '';
      if (item.spicy && item.spicy > 0) {
        const sLabel = getSpicyLabel(item.spicy, currentLang);
        spicyHtml = `<span class="spicy-badge" title="${sLabel}">${'🌶️'.repeat(item.spicy)} <span class="spicy-text">${sLabel}</span></span>`;
      }

      // Special Badges (hafta içi / hafta sonu / günlük sınırlı üretim)
      let badgeHtml = '';
      if (item.badge) {
        const badgeText = item.badge[currentLang] || item.badge.tr;
        badgeHtml = `<span class="custom-badge">${badgeText}</span>`;
      }

      card.innerHTML = `
        <div class="card-top-content" onclick="openProductModalById('${item.id}')">
          <div class="card-info">
            <div class="card-title-row">
              <span class="product-name">${name}</span>
              ${spicyHtml}
              ${badgeHtml}
            </div>
            <p class="product-description">${desc}</p>
            <div class="product-price">${priceFormatted}</div>
          </div>
          <div class="card-image-box">
            <img src="${item.image}" alt="${name}" loading="lazy">
          </div>
        </div>
        <div class="card-cta-bar">
          <span class="cta-text-icon" onclick="openProductModalById('${item.id}')">
            <svg class="cta-icon-camera" viewBox="0 0 24 24">
              <path d="M12 12m-3.2 0a3.2 3.2 0 1 0 6.4 0 3.2 3.2 0 1 0 -6.4 0"/>
              <path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
            </svg>
            <span>${t.tapForDetails}</span>
            <span class="cta-arrow">›</span>
          </span>
          
          <!-- Tepsime Ekle Button -->
          <button class="btn-add-tray ${inTrayClass}" id="btn-tray-${item.id}" data-item-id="${item.id}" onclick="addToTray('${item.id}', event)">
            <span>${btnText}</span>
            <span class="plus-symbol">+</span>
          </button>
        </div>
      `;

      return card;
    }

    // 6. Modal Bottom Sheet for Product Details & Allergens
    function openProductModalById(itemId) {
      const item = menuData.items.find(i => i.id === itemId);
      if (!item) return;
      activeModalItem = item;

      const modal = document.getElementById('product-modal');
      const t = uiTexts[currentLang];

      const name = item.name[currentLang] || item.name.tr;
      const desc = item.description[currentLang] || item.description.tr;

      document.getElementById('modal-img').src = item.image;
      document.getElementById('modal-title').textContent = name;
      document.getElementById('modal-price').textContent = `${item.price} ₺`;
      document.getElementById('modal-desc').textContent = desc;
      document.getElementById('modal-allergen-heading').querySelector('span').textContent = t.allergenTitle;

      // Update modal add to tray button
      const existingInTray = tray.find(x => x.id === item.id);
      const isAdded = existingInTray && existingInTray.qty > 0;
      const modalBtn = document.getElementById('modal-add-tray-btn');
      if (isAdded) {
        modalBtn.classList.add('in-tray');
        document.getElementById('modal-add-tray-text').textContent = `${t.inTray} (${existingInTray.qty})`;
      } else {
        modalBtn.classList.remove('in-tray');
        document.getElementById('modal-add-tray-text').textContent = t.addToTray;
      }

      // Badges
      const badgesContainer = document.getElementById('modal-badges');
      badgesContainer.innerHTML = '';
      if (item.spicy && item.spicy > 0) {
        const span = document.createElement('span');
        span.className = 'spicy-badge';
        const sLabel = getSpicyLabel(item.spicy, currentLang);
        span.innerHTML = `${'🌶️'.repeat(item.spicy)} <span class="spicy-text">${sLabel}</span>`;
        badgesContainer.appendChild(span);
      }
      if (item.badge) {
        const b = document.createElement('span');
        b.className = 'custom-badge';
        b.textContent = item.badge[currentLang] || item.badge.tr;
        badgesContainer.appendChild(b);
      }

      // Allergens list
      const allergensContainer = document.getElementById('modal-allergens');
      allergensContainer.innerHTML = '';

      if (item.allergens && item.allergens.length > 0) {
        item.allergens.forEach(allg => {
          const chip = document.createElement('span');
          chip.className = 'allergen-chip';
          const icon = allergenIcons[allg.code] || allergenIcons.default;
          const label = allg[currentLang] || allg.tr;
          chip.innerHTML = `<span>${icon}</span> <span>${label}</span>`;
          allergensContainer.appendChild(chip);
        });
      } else {
        const emptyChip = document.createElement('span');
        emptyChip.className = 'allergen-chip empty';
        emptyChip.textContent = t.noAllergens;
        allergensContainer.appendChild(emptyChip);
      }

      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      const modal = document.getElementById('product-modal');
      modal.classList.remove('open');
      document.body.style.overflow = '';
      activeModalItem = null;
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === 'product-modal') {
        closeModal();
      }
    }

    // 7. Tray System (Tepsi Yönetimi)
    function addToTray(itemId, event) {
      if (event) event.stopPropagation();

      const item = menuData.items.find(i => i.id === itemId);
      if (!item) return;

      const existing = tray.find(t => t.id === itemId);
      if (existing) {
        existing.qty += 1;
      } else {
        tray.push({
          id: item.id,
          nameTr: item.name.tr,
          nameEn: item.name.en,
          price: item.price,
          qty: 1
        });
      }

      // Trigger Badge pulse animation
      const badge = document.getElementById('tray-badge-count');
      badge.classList.remove('pulse');
      void badge.offsetWidth; // reflow
      badge.classList.add('pulse');

      // Visual tactile bounce on clicked button
      const clickedBtn = document.getElementById(`btn-tray-${itemId}`);
      if (clickedBtn) {
        clickedBtn.classList.add('btn-pressed');
        setTimeout(() => clickedBtn.classList.remove('btn-pressed'), 180);
      }

      updateTrayUI();
    }

    function handleAddModalItemToTray() {
      if (activeModalItem) {
        const modalBtn = document.getElementById('modal-add-tray-btn');
        modalBtn.classList.add('btn-pressed');
        setTimeout(() => {
          modalBtn.classList.remove('btn-pressed');
          addToTray(activeModalItem.id);
          closeModal();
        }, 120);
      }
    }

    function updateTrayQty(itemId, delta) {
      const item = tray.find(t => t.id === itemId);
      if (!item) return;

      item.qty += delta;
      if (item.qty <= 0) {
        tray = tray.filter(t => t.id !== itemId);
      }
      updateTrayUI();
      renderTrayModalItems();
    }

    function clearTray() {
      tray = [];
      updateTrayUI();
      renderTrayModalItems();
    }

    function updateTrayUI() {
      const totalQty = tray.reduce((sum, i) => sum + i.qty, 0);
      document.getElementById('tray-badge-count').textContent = totalQty;
      const t = uiTexts[currentLang];

      // Update all "Tepsime Ekle" buttons on the cards
      document.querySelectorAll('.btn-add-tray').forEach(btn => {
        const itemId = btn.getAttribute('data-item-id');
        const trayItem = tray.find(x => x.id === itemId);
        if (trayItem && trayItem.qty > 0) {
          btn.classList.add('in-tray');
          btn.innerHTML = `<span>${t.inTray} (${trayItem.qty})</span> <span class="plus-symbol">+</span>`;
        } else {
          btn.classList.remove('in-tray');
          btn.innerHTML = `<span>${t.addToTray}</span> <span class="plus-symbol">+</span>`;
        }
      });

      // Update modal add to tray button if open
      if (activeModalItem) {
        const trayItem = tray.find(x => x.id === activeModalItem.id);
        const modalBtn = document.getElementById('modal-add-tray-btn');
        if (trayItem && trayItem.qty > 0) {
          modalBtn.classList.add('in-tray');
          document.getElementById('modal-add-tray-text').textContent = `${t.inTray} (${trayItem.qty})`;
        } else {
          modalBtn.classList.remove('in-tray');
          document.getElementById('modal-add-tray-text').textContent = t.addToTray;
        }
      }
    }

    // Tray Modal
    function openTrayModal() {
      const bar = document.getElementById('tray-floating-bar');
      bar.classList.add('bar-pressed');
      setTimeout(() => bar.classList.remove('bar-pressed'), 180);

      renderTrayModalItems();
      document.getElementById('tray-modal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeTrayModal() {
      document.getElementById('tray-modal').classList.remove('open');
      document.body.style.overflow = '';
    }

    function closeTrayModalOnBackdrop(e) {
      if (e.target.id === 'tray-modal') {
        closeTrayModal();
      }
    }

    function renderTrayModalItems() {
      const container = document.getElementById('tray-items-container');
      container.innerHTML = '';
      const t = uiTexts[currentLang];

      if (tray.length === 0) {
        container.innerHTML = `<div class="tray-empty-message">${t.emptyTray}</div>`;
        return;
      }

      tray.forEach(item => {
        const name = currentLang === 'en' ? item.nameEn : item.nameTr;
        const row = document.createElement('div');
        row.className = 'tray-item-row';
        row.innerHTML = `
          <div class="tray-item-details">
            <div class="tray-item-name">${name}</div>
          </div>
          <div class="tray-qty-ctrl">
            <button class="tray-qty-btn" onclick="updateTrayQty('${item.id}', -1)">-</button>
            <span class="tray-qty-val">${item.qty}</span>
            <button class="tray-qty-btn" onclick="updateTrayQty('${item.id}', 1)">+</button>
          </div>
        `;
        container.appendChild(row);
      });
    }

    // 8. ScrollSpy for Category Navigation
    function setupScrollSpy() {
      const sections = document.querySelectorAll('.category-section');
      
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const catId = entry.target.id.replace('sec-', '');
            activeCategoryId = catId;
            updateActiveCategoryNav(catId);
          }
        });
      }, {
        root: null,
        rootMargin: '-20% 0px -70% 0px',
        threshold: 0
      });

      sections.forEach(sec => observer.observe(sec));
    }

    // 9. Privacy-Friendly Unique Visitor Analytics Tracking
    function recordMenuAnalytics() {
      try {
        // 1. Exclude Admin & Staff Devices:
        // Admin paneline girmiş olan, giriş şifresi veya GitHub token'ı bulunan cihazlar menüyü açtığında ASLA sayılmaz!
        const isAdminDevice = localStorage.getItem('deli_is_admin_device') === 'true' ||
                              localStorage.getItem('deli_admin_logged_in') === 'true' ||
                              localStorage.getItem('deli_github_token') ||
                              sessionStorage.getItem('deli_admin_logged_in') === 'true' ||
                              (document.referrer && document.referrer.includes('admin')) ||
                              window.location.search.includes('admin') ||
                              window.location.pathname.includes('admin');
        if (isAdminDevice) {
          console.log('[Analytics] Yönetici/Personel cihazı tespit edildi — Ziyaretçi sayacına işlenmedi.');
          return;
        }

        // 2. Exclude Bots, Web Crawlers & Headless Browsers:
        if (navigator.webdriver) return;
        const botRegex = /bot|crawl|spider|slurp|facebookexternalhit|whatsapp|headless|lighthouse|preview|search/i;
        if (botRegex.test(navigator.userAgent)) return;

        // 3. Exclude Local Development:
        const isLocal = window.location.hostname === 'localhost' || 
                        window.location.hostname === '127.0.0.1' || 
                        window.location.hostname.endsWith('.local');
        if (isLocal) return;

        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        const todayStr = `${now.getFullYear()}_${pad(now.getMonth() + 1)}_${pad(now.getDate())}`;

        const hitKey = (key) => {
          try {
            fetch(`https://countapi.mileshilliard.com/api/v1/hit/${key}`, { mode: 'cors', priority: 'low' })
              .catch(() => {
                fetch(`https://abacus.jasoncameron.dev/hit/delinapolitan/${key}`, { mode: 'cors', priority: 'low' }).catch(() => {});
              });
          } catch(e) {}
        };

        // Always increment today's total page views & all-time total views (reloads & return visits)
        hitKey(`deli_day_${todayStr}`);
        hitKey('deli_total_views');

        // Strict Daily Unique Visitor Tracking:
        // localStorage persists even if customer locks phone, switches apps, or reopens Safari.
        // A customer visiting 1, 2, or 10 times in a single day is counted strictly ONCE per day.
        const lastVisitDay = localStorage.getItem('deli_last_unique_visit_day');
        if (lastVisitDay !== todayStr) {
          localStorage.setItem('deli_last_unique_visit_day', todayStr);
          hitKey(`deli_uniq_${todayStr}`);
          hitKey('deli_total_unique_visitors');

          // Track device type (strictly unique visitors)
          const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
          const isAndroid = /Android/.test(navigator.userAgent);
          if (isIOS) hitKey('deli_dev_ios');
          else if (isAndroid) hitKey('deli_dev_android');
          else hitKey('deli_dev_other');
        }

        // 10. Live Active Menu Reading Duration Heartbeat
        // Her 20 saniyelik aktif sayfa incelemesinde deli_dur_<tarih> sayacına +1 blok eklenir.
        // Sekme arka plana atıldığında veya ekran kilitlendiğinde sayaç durur.
        let activeSeconds = 0;
        const maxActiveSeconds = 900; // 15 dakika üst sınır
        const durIntervalSec = 20;

        const durIntervalId = setInterval(() => {
          if (document.visibilityState === 'visible') {
            activeSeconds += durIntervalSec;
            hitKey(`deli_dur_${todayStr}`);
            if (activeSeconds >= maxActiveSeconds) {
              clearInterval(durIntervalId);
            }
          }
        }, durIntervalSec * 1000);

        window.addEventListener('beforeunload', () => {
          clearInterval(durIntervalId);
        });
      } catch (err) {}
    }

    // Initialize
    window.addEventListener('DOMContentLoaded', () => {
      // Enable iOS Safari active states immediately on tap
      document.addEventListener("touchstart", function(){}, { passive: true });
      initLanguage();
      loadMenuData();
      recordMenuAnalytics();
    });
  </script>
</body>
</html>
